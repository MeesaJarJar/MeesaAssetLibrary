name: Refresh semantic embeddings

# Daily maintenance: rebuild the embedding bins and search index, then commit
# only the generated catalog files that actually changed. After a real change
# the job dispatches the Pages workflow, so new uploads become semantically
# searchable within a day.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  # Needed to queue the Pages build explicitly: a push made with GITHUB_TOKEN
  # does not trigger other workflows on its own.
  actions: write

concurrency:
  group: embed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CPU embedding dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers soundfile pillow

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('scripts/embed.py') }}
          restore-keys: |
            hf-${{ runner.os }}-

      # scripts/embed.py loads from the local Hugging Face cache only. Seed a
      # cold cache on the first run; later runs restore it with actions/cache.
      - name: Warm Hugging Face cache
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          for repo_id in ("openai/clip-vit-base-patch32", "laion/clap-htsat-unfused"):
              print("Downloading", repo_id)
              snapshot_download(repo_id)
          PY

      - name: Generate embeddings
        run: python scripts/embed.py

      - name: Rebuild search index
        run: node scripts/build-search-index.mjs

      - name: Commit refreshed artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/embeddings.json \
                  catalog/embeddings-clip.bin \
                  catalog/embeddings-clap.bin \
                  catalog/concepts.json \
                  catalog/search-index.json
          if git diff --cached --quiet; then
            echo "No catalog changes; semantic artifacts are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Refresh semantic embeddings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not create new workflow runs, so ask Pages to
      # rebuild explicitly after a real change.
      - name: Queue Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
